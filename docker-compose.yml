services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: materials
    # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432.
    # 127.0.0.1 so only this machine can connect, not others on the same network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d materials"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
